name: Validate ATS integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax and UI translation JSON
        run: |
          python -m compileall -q custom_components/ats
          node --check custom_components/ats/www/invoice-history-card.js
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('custom_components/ats')
          source = json.loads((root / 'strings.json').read_text())
          translation = json.loads((root / 'translations/it.json').read_text())
          for section in ('config', 'options'):
              for step, spec in source[section]['step'].items():
                  actual = translation[section]['step'][step]['data']
                  assert set(spec['data']) <= set(actual), (section, step)
          assert set(source['config']['error']) <= set(translation['config']['error'])
          assert set(source['config']['abort']) <= set(translation['config']['abort'])
          print('Python syntax and ATS UI translations: OK')
          PY

  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline ATS tests (no Home Assistant)
        run: |
          python -m pip install --disable-pip-version-check aiohttp
          # These modules import only aiohttp + stdlib (auth discovery, URL
          # building, login regression). HA-dependent tests run in ha-tests.
          python -m unittest tests.test_auth tests.test_discovery -v

  ha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Home Assistant integration tests
        run: |
          python -m pip install --disable-pip-version-check \
            pytest-homeassistant-custom-component home-assistant-frontend
          python -m pytest tests/ -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  publish-beta7:
    # Never publish from PRs, other branches, or before all checks are green.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/ats-beta7-clean-install-20261108'
    needs: [syntax, offline-tests, ha-tests, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub prerelease v0.4.0-beta.7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v0.4.0-beta.7
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Prerelease already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "ATS v0.4.0-beta.7" \
            --notes "Beta.7: live-parity ATS sensors, corrected payments and SupplyNo, authenticated on-demand PDF archive, bundled PDF.js Lovelace card, example dashboards, Italian/English docs and clean-instance tests. No user credentials or invoices are bundled. This is a pre-release from EnrCol/ats-ha, not an upstream release."
