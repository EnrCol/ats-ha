name: Validate ATS integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Python syntax and UI translation JSON
        run: |
          python -m compileall -q custom_components/ats
          node --check custom_components/ats/www/invoice-history-card.js
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('custom_components/ats')
          source = json.loads((root / 'strings.json').read_text())
          translation = json.loads((root / 'translations/it.json').read_text())
          for section in ('config', 'options'):
              for step, spec in source[section]['step'].items():
                  actual = translation[section]['step'][step]['data']
                  assert set(spec['data']) <= set(actual), (section, step)
          assert set(source['config']['error']) <= set(translation['config']['error'])
          assert set(source['config']['abort']) <= set(translation['config']['abort'])
          print('Python syntax and ATS UI translations: OK')
          PY

  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline ATS tests (no Home Assistant)
        run: |
          python -m pip install --disable-pip-version-check aiohttp
          # These modules import only aiohttp + stdlib (auth discovery, URL
          # building, login regression). HA-dependent tests run in ha-tests.
          python -m unittest tests.test_auth tests.test_discovery -v

  ha-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Home Assistant integration tests
        run: |
          python -m pip install --disable-pip-version-check \
            pytest-homeassistant-custom-component home-assistant-frontend
          python -m pytest tests/ -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
