title: ATS · Acqua
views:
  - title: ATS
    path: ats
    icon: mdi:water
    type: masonry
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: |
              {% set ats = namespace(ids={}) %}
              {% for eid in integration_entities('ats') %}
                {% set metric = state_attr(eid, 'ats_metric') %}
                {% if metric is string %}
                  {% set ats.ids = dict(ats.ids, **{metric: eid}) %}
                {% endif %}
              {% endfor %}
              ## Acqua · ATS
              **Utenze attive:** {{ states(ats.ids.get('active_supplies', 'sensor.ats_missing')) }}
              **Fatture disponibili:** {{ states(ats.ids.get('invoice_count', 'sensor.ats_missing')) }}
              **Fatture da pagare:** {{ states(ats.ids.get('unpaid_count', 'sensor.ats_missing')) }}
              {% set residuo = states(ats.ids.get('remaining_total', 'sensor.ats_missing')) %}
              **Residuo:** {{ ('%.2f €' | format(residuo | float)) if is_number(residuo) else 'Non disponibile' }}
              {% set forecast_id = ats.ids.get('annual_consumption_forecast', '') %}
              {% set previsione = states(forecast_id) if forecast_id else 'unknown' %}
              {% set stima = state_attr(forecast_id, 'stima_ats_m3_anno') if forecast_id else none %}
              {% if is_number(previsione) %}
              **Consumo annuo da letture:** {{ previsione | float | round(0) }} m³/anno
              {% elif is_number(stima) %}
              **Stima annua ATS:** {{ stima | float | round(0) }} m³/anno
              {% else %}
              **Consumo annuo:** Non disponibile
              {% endif %}
              **Ultima lettura:** {{ states(ats.ids.get('last_reading_date', 'sensor.ats_missing')) }}
          - type: button
            name: Scarica fatture ATS mancanti
            icon: mdi:file-pdf-box
            show_state: false
            tap_action:
              action: perform-action
              perform_action: ats.download_invoices
              confirmation:
                text: Scaricare sul server Home Assistant le fatture ATS mancanti?
          - type: custom:ats-invoice-history-card
            title: Storico fatture ATS
